<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrewOps</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="bean-icon" viewBox="0 0 40 56" width="34" height="34" role="img" aria-label="Coffee bean">
        <defs>
          <linearGradient id="bean-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--crema)" />
            <stop offset="100%" stop-color="var(--brass-deep)" />
          </linearGradient>
        </defs>
        <path d="M20 2C10 2 4 14 4 28c0 14 6 26 16 26s16-12 16-26C36 14 30 2 20 2Z" fill="url(#bean-grad)" />
        <path d="M20 6C14 16 26 20 20 28C14 36 26 40 20 50" fill="none" stroke="var(--roast)" stroke-width="3" stroke-linecap="round" />
      </svg>
      <h1>BrewOps</h1>
    </div>
    <p class="tagline">Office coffee fleet — telemetry &amp; operations</p>
  </header>

  <main>
    <!-- Zone 1: dashboard -->
    <section id="dashboard">
      <div class="panel filter-bar" id="date-filter">
        <label for="filter-start">From</label>
        <input type="date" id="filter-start">
        <label for="filter-end">To</label>
        <input type="date" id="filter-end">
        <button type="button" class="preset" data-days="7">Last 7 days</button>
        <button type="button" class="preset" data-days="30">Last 30 days</button>
        <button type="button" class="preset" data-days="all">All time</button>
        <a id="export-csv" class="export-link" href="/api/brews/export.csv" download>Export CSV</a>
        <p id="filter-message" class="message" role="status"></p>
      </div>

      <div class="stat-tiles">
        <div class="tile">
          <span class="tile-number" id="total-brews">–</span>
          <span class="tile-label" id="total-label">brews total</span>
        </div>
        <div class="tile">
          <span class="tile-number" id="brews-today">–</span>
          <span class="tile-label" id="last-day-label">brews on last active day</span>
        </div>
        <div class="tile">
          <span class="tile-number" id="machine-count">–</span>
          <span class="tile-label">machines</span>
        </div>
      </div>

      <div class="panel">
        <h2>Per drink</h2>
        <div id="drink-bars"></div>
      </div>

      <div class="panel">
        <h2>Brews over time</h2>
        <svg id="timeline" viewBox="0 0 600 130" preserveAspectRatio="none" role="img"
             aria-label="Brews per day"></svg>
      </div>

      <div class="panel">
        <h2>Machines</h2>
        <div id="machine-cards" class="cards"></div>
      </div>
    </section>

    <!-- Zone 2: log a brew (manual entry for machines without telemetry) -->
    <section class="panel form-panel">
      <h2>Log a brew</h2>
      <p class="hint">For machines that don't report their own events — looking at you, Old Faithful.</p>
      <form id="brew-form">
        <label for="brew-machine">Machine</label>
        <select id="brew-machine" required></select>

        <label for="brew-drink">Drink</label>
        <select id="brew-drink" required></select>

        <label for="brew-timestamp">When</label>
        <input type="datetime-local" id="brew-timestamp" required>

        <button type="submit" id="brew-submit">Log brew</button>
        <p id="brew-message" class="message" role="status"></p>
      </form>
    </section>

    <!-- Zone 3: log maintenance -->
    <section class="panel form-panel">
      <h2>Log maintenance</h2>
      <form id="maintenance-form">
        <label for="maintenance-machine">Machine</label>
        <select id="maintenance-machine" required></select>

        <label for="maintenance-type">Type</label>
        <select id="maintenance-type" required>
          <option value="descale">Descale</option>
          <option value="refill">Refill</option>
          <option value="repair">Repair</option>
          <option value="error">Error</option>
        </select>

        <label for="maintenance-timestamp">When</label>
        <input type="datetime-local" id="maintenance-timestamp" required>

        <label for="maintenance-note">Note</label>
        <input type="text" id="maintenance-note" placeholder="optional">

        <button type="submit" id="maintenance-submit">Log maintenance</button>
        <p id="maintenance-message" class="message" role="status"></p>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
